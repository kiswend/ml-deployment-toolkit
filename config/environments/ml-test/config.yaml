# ------------------------------------------------------------------
# INFRASTRUCTURE & CLUSTER CONFIGURATION
# ------------------------------------------------------------------
# Secrets live in config/.env (sourced via Makefile).
# Proxmox credentials: native PROXMOX_VE_* env vars.
# Flux-config secrets: TF_VAR_* env vars (digitalocean_token, oci_repo_*, oci_proxy_*).
# ------------------------------------------------------------------

# ------------------------------------------------------------------
# 1. INFRASTRUCTURE PROVIDER
# ------------------------------------------------------------------
infra:
  provider: "proxmox"  # proxmox | aws | digitalocean

  # --- Proxmox ---
  proxmox:
    # Maps deployment template placement groups → Proxmox physical nodes
    placement:
      placement-group-1: "node0"
      placement-group-2: "node1"

  # # --- AWS ---
  # aws:
  #   region: "us-east-1"
  #   vpc_cidr: "10.0.0.0/16"
  #   availability_zones:
  #     - "us-east-1a"
  #     - "us-east-1b"
  #     - "us-east-1c"

  # # --- DigitalOcean ---
  # digitalocean:
  #   region: "nyc1"
  #   vpc_cidr: "10.10.0.0/16"

# ------------------------------------------------------------------
# 2. DEPLOYMENT TOPOLOGY
# ------------------------------------------------------------------
template: "h2c1w4"  # h1m1 | h2c1w4 | h2c3w3 | h3c3w3

# ------------------------------------------------------------------
# 3. CLUSTER PARAMETERS
# ------------------------------------------------------------------
cluster:
  name: "ml-test"
  role: "env"                        # cc | env — determines which gitops paths are deployed

  # Kubernetes API endpoint
  vip: "192.168.88.14"              # Proxmox: floating IP

  # Flux configuration
  flux:
    version: "2.7.2"

# ------------------------------------------------------------------
# 4. DNS
# ------------------------------------------------------------------
dns:
  provider: "digitalocean"
  # domain: "ml-test.ml.example.com"
  domain: "sw4.pj1.moja-do.example.com"

  # For Cloudflare:
  # cloudflare:
  #   proxied: false

  # For AWS:
  # aws:
  #   region: "us-east-1"

# ------------------------------------------------------------------
# 5. APPLICATION PARAMETERS
# ------------------------------------------------------------------
app:
  lb_ipam:
    range: "192.168.88.15-192.168.88.17"
  alert_email: "nathan@example.com"

# ------------------------------------------------------------------
# 6. BACKUP
# ------------------------------------------------------------------
backup:
  s3:
    endpoint: "https://s3.int.cc1.pj1.moja-do.example.com"
    bucket: "backups"
    region: "us-east-1"
  # Credentials (BACKUP_S3_ACCESS_KEY, BACKUP_S3_SECRET_KEY) live in .env

# ------------------------------------------------------------------
# 6.5. OBSERVABILITY
# ------------------------------------------------------------------
observability:
  loki_url: "https://loki.int.cc1.pj1.moja-do.example.com/loki/api/v1/push"
  mimir_url: "https://thanos.int.cc1.pj1.moja-do.example.com/api/v1/receive"
  # tempo_url: "https://tempo.int.cc1.pj1.moja-do.example.com:4318"         # For Phase 3

# ------------------------------------------------------------------
# 7. OCI CONFIGURATION
# ------------------------------------------------------------------
oci:
  # OCI-REPO: Platform team's OCI registry where the Flux gitops artifact lives
  repo:
    active: true                    # Enable Flux OCI reconciliation
    url: "oci://ghcr.io/kiswend/ml-iac3"
    version: "latest"               # OCI tag — use "latest" or pin to a specific version

  # OCI-PROXY: Harbor as transparent pull-through cache for container images
  # Configured at Talos level (machine.registries.mirrors) so containerd routes pulls through Harbor
  proxy:
    active: true                   # Enable container image proxy through Harbor
    url: "harbor.int.cc1.pj1.moja-do.example.com"   # Harbor proxy cache URL (no oci:// prefix — used in Talos mirrors)
