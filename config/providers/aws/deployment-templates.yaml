# -----------------------------------------------------------------------------
# AWS Deployment Templates (EKS Managed Kubernetes)
# Defines cluster topologies with EKS node groups
# Control plane is fully managed by AWS
# -----------------------------------------------------------------------------

micro:
  node_groups:
    - name: default
      instance_types:
        - m5.xlarge
      desired_size: 1
      min_size: 1
      max_size: 2
      tags:
        - ml

tiny:
  node_groups:
    - name: default
      instance_types:
        - m5.xlarge
      desired_size: 2
      min_size: 2
      max_size: 4
      tags:
        - ml

small:
  node_groups:
    - name: default
      instance_types:
        - m5.xlarge
      desired_size: 3
      min_size: 3
      max_size: 6
      tags:
        - ml

small3m3w:
  node_groups:
    - name: default
      instance_types:
        - m5.xlarge
      desired_size: 6
      min_size: 6
      max_size: 9
      tags:
        - ml
