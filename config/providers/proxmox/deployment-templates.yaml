h1m1:
  instances:
    - name: m-0
      placement_group: placement-group-1
      cores: 8
      memory: 9216
      workload_class: mixed-plane
      storage:
        - storage_pool: local-lvm
          size: 64
          interface: scsi0
        - storage_pool: local-lvm
          size: 64
          interface: scsi1
      tags:
        - ml
        - ml-mixed

