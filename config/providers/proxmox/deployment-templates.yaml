        - ml
        - ml-worker

    - name: w-2
      placement_group: placement-group-2
      cores: 4
      memory: 7000
      workload_class: worker-general
      storage:
        - storage_pool: local-lvm
          size: 64
          interface: scsi0
        - storage_pool: local-lvm
          size: 64
          interface: scsi1
      tags:
        - ml
        - ml-worker

