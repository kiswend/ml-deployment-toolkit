# -----------------------------------------------------------------------------
# Proxmox Deployment Templates
# Defines cluster topologies with direct VM specs
# -----------------------------------------------------------------------------


h1m1:
  instances:
    - name: m-0
      placement_group: placement-group-1
      cores: 4
      memory: 12000
      workload_class: mixed-plane
      storage:
        - storage_pool: local-lvm
          size: 64
          interface: scsi0
        - storage_pool: local-lvm
          size: 64
          interface: scsi1
      tags:
        - ml
        - ml-mixed

h2c3w3:
  instances:
    # Control plane nodes — all on host 1
    - name: c-0
      placement_group: placement-group-1
      cores: 4
      memory: 7000
      workload_class: control-plane
      storage:
        - storage_pool: local-lvm
          size: 32
          interface: scsi0
      tags:
        - ml
        - ml-master

    - name: c-1
      placement_group: placement-group-1
      cores: 4
      memory: 7000
      workload_class: control-plane
      storage:
        - storage_pool: local-lvm
          size: 32
          interface: scsi0
      tags:
        - ml
        - ml-master

    - name: c-2
      placement_group: placement-group-1
      cores: 4
      memory: 7000
      workload_class: control-plane
      storage:
        - storage_pool: local-lvm
          size: 32
          interface: scsi0
      tags:
        - ml
        - ml-master

    # Worker nodes — all on host 2
    - name: w-0
      placement_group: placement-group-2
      cores: 4
      memory: 7000
      workload_class: worker-general
      storage:
        - storage_pool: local-lvm
          size: 64
          interface: scsi0
        - storage_pool: local-lvm
          size: 64
          interface: scsi1
      tags:
        - ml
        - ml-worker

    - name: w-1
      placement_group: placement-group-2
      cores: 4
      memory: 7000
      workload_class: worker-general
      storage:
        - storage_pool: local-lvm
          size: 64
