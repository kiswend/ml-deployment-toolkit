# -----------------------------------------------------------------------------
# Deployment Templates
# Defines cluster topologies matching legacy ml-iac structure
# -----------------------------------------------------------------------------

sizes:
  - name: tiny
    instances:
      - name: cc-master-0
        placement:
          region: region-1
          zone: zone-1
          placement_group: placement-group-1
        instance_type: co-4vcpu-8gb
        workload_class: control-plane
        storage:
          - storage-1:
              class: local-standard
              size: 32
              interface: scsi0
        tags:
          - ml
          - ml-master

      - name: cc-worker-0
        placement:
          region: region-1
          zone: zone-1
          placement_group: placement-group-1
        instance_type: co-4vcpu-8gb
        workload_class: worker-general
        storage:
          - storage-1:
              class: local-standard
              size: 64
              interface: scsi0
          - storage-2:
              class: local-standard
              size: 64
              interface: scsi1
        tags:
          - ml
          - ml-worker

