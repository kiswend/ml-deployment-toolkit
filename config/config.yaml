# ------------------------------------------------------------------
# INFRASTRUCTURE & CLUSTER CONFIGURATION
# ------------------------------------------------------------------
# Secrets live in config/.env (sourced via Makefile).
# Proxmox credentials: native PROXMOX_VE_* env vars.
# Flux-config secrets: TF_VAR_* env vars (digitalocean_token, oci_username, oci_password).
# ------------------------------------------------------------------

# ------------------------------------------------------------------
# 1. INFRASTRUCTURE PROVIDER
# ------------------------------------------------------------------
infra:
  provider: "proxmox"  # proxmox | aws | digitalocean

  # --- Proxmox ---
  proxmox:
    # Maps deployment template placement groups → Proxmox physical nodes
    placement:
      placement-group-1: "node0"
      placement-group-2: "node1"
      placement-group-3: "node0"

  # # --- AWS ---
  # aws:
  #   region: "us-east-1"
  #   vpc_cidr: "10.0.0.0/16"
  #   availability_zones:
  #     - "us-east-1a"
  #     - "us-east-1b"
  #     - "us-east-1c"

  # # --- DigitalOcean ---
  # digitalocean:
  #   region: "nyc1"
  #   vpc_cidr: "10.10.0.0/16"

# ------------------------------------------------------------------
# 2. DEPLOYMENT TOPOLOGY
# ------------------------------------------------------------------
template: "h1m1"  # h1m1 | h2c3w3 | h3c3w3

# ------------------------------------------------------------------
# 3. CLUSTER PARAMETERS
# ------------------------------------------------------------------
cluster:
  name: "cc"
  role: "cc"                        # cc | env — determines which gitops paths are deployed

  # Kubernetes API endpoint
  vip: "192.168.88.10"              # Proxmox: floating IP

  # Flux configuration
  flux:
    version: "2.7.2"
    mode: "oci"                    # none (install controllers only) | oci (reconcile from artifact)
    artifact:
      url: "oci://ghcr.io/kiswend/ml-iac3"
      version: "latest"             # OCI tag — use "latest" or pin to a specific version

# ------------------------------------------------------------------
# 4. DNS
# ------------------------------------------------------------------
dns:
  provider: "digitalocean"
  domain: "cc.ml.example.com"

  # For Cloudflare:
  # cloudflare:
  #   proxied: false

  # For AWS:
  # aws:
  #   region: "us-east-1"

# ------------------------------------------------------------------
# 5. APPLICATION PARAMETERS
# ------------------------------------------------------------------
app:
  lb_ipam:
    range: "192.168.88.100-192.168.88.110"
  alert_email: "nathan@example.com"
