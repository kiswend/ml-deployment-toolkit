# ------------------------------------------------------------------
# INFRASTRUCTURE & CLUSTER CONFIGURATION (V3)
# ------------------------------------------------------------------

# ------------------------------------------------------------------
# 1. INFRASTRUCTURE PROVIDER
# ------------------------------------------------------------------
infra:
  provider: "proxmox"

  # --- Proxmox Parameters ---
  proxmox:
    endpoint: "${PROXMOX_VE_ENDPOINT}"
    cluster: "ml-cluster"
    credentials:
      # Token in full format: user@pam!token_id=secret
      api_token: "${PROXMOX_VE_API_TOKEN}"
      ssh_user: "${PROXMOX_VE_SSH_USERNAME}"
      ssh_password: "${PROXMOX_VE_SSH_PASSWORD}"
    
    # Node Mapping: Maps abstract template nodes to physical hosts
    nodes:
      node_1: "pve-01"
      node_2: "pve-02"
      node_3: "pve-03"

# ------------------------------------------------------------------
# 2. DEPLOYMENT TOPOLOGY
# ------------------------------------------------------------------
template: "ha-small"

# ------------------------------------------------------------------
# 3. CLUSTER PARAMETERS
# ------------------------------------------------------------------
cluster:
  name: "control-center"
  vip: "192.168.88.12"
  
  # Artifact Repository (Mirror/Cache)
  artifact_repo:
    url: "${OCI_URL}"
    credentials:
      username: "${OCI_USERNAME}"
      password: "${OCI_PASSWORD}"

  # Flux Bootstrap Mode
  flux:
    mode: "none" # none (Manual Push - Day 0) | oci (Pull from Harbor - Day 2)
    version: "2.2.0"

# ------------------------------------------------------------------
# 4. EXTERNAL SERVICES & DNS
# ------------------------------------------------------------------
dns:
  provider: "cloudflare" # route53 | cloudflare | manual
  domain: "${DOMAIN_NAME}"
  email: "admin@${DOMAIN_NAME}"
  # Credentials handled via env vars for provider

# ------------------------------------------------------------------
# 5. APPLICATION PARAMETERS (Runtime Bridge)
# ------------------------------------------------------------------
app:
  # Load Balancer IP Management
  lb_ipam:
    range: "192.168.88.100-192.168.88.110"
  
  # Observability / Alerts
  alert_email: "ops@${DOMAIN_NAME}"
