apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-console
  namespace: minio
spec:
  parentRefs:
    - name: main-gateway
      namespace: platform-system
  hostnames:
    - "minio.${domain}"
  rules:
    - backendRefs:
        - name: minio-console
          port: 9001
