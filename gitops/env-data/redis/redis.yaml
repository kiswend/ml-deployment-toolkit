apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: ttk-redis
  namespace: mojaloop
spec:
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.0.12
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
