apiVersion: v1
kind: Secret
metadata:
  name: mojaloop-db-secrets
  namespace: mojaloop
type: Opaque
stringData:
  root: "${mysql_root_password}"
  xtrabackup: "${mysql_root_password}"
  monitor: "${mysql_root_password}"
  operator: "${mysql_root_password}"
  replication: "${mysql_root_password}"
---
# Default secret name expected by Mojaloop Helm chart for DB password references
apiVersion: v1
kind: Secret
metadata:
  name: mysqldb
  namespace: mojaloop
type: Opaque
stringData:
  mysql-password: "${mysql_central_ledger_password}"
  mysql-als-password: "${mysql_account_lookup_password}"
  mysql-oracle-password: "${mysql_oracle_msisdn_password}"
---
# Auth database application user passwords (referenced by PXC spec.users[].passwordSecretRef)
apiVersion: v1
kind: Secret
metadata:
  name: auth-db-app-secrets
  namespace: mojaloop
type: Opaque
stringData:
  keycloak-password: "${keycloak_db_password}"
  kratos-password: "${kratos_db_password}"
  keto-password: "${keto_db_password}"
  mcm-password: "${mcm_db_password}"
