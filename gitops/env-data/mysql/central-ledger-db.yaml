apiVersion: pxc.percona.com/v1
kind: PerconaXtraDBCluster
metadata:
  name: central-ledger-db
  namespace: mojaloop
spec:
  crVersion: "1.19.0"
  allowUnsafeConfigurations: true
  secretsName: central-ledger-db-secrets
  pxc:
    size: 1
    image: percona/percona-xtradb-cluster:8.0.44-35.1
    resources:
      requests:
        memory: 1Gi
        cpu: 500m
      limits:
        memory: 2Gi
        cpu: "1"
    volumeSpec:
      persistentVolumeClaim:
        resources:
          requests:
            storage: 8Gi
    configuration: |
      [mysqld]
      pxc_strict_mode=PERMISSIVE
      default_authentication_plugin=mysql_native_password
      wsrep_auto_increment_control=OFF
      auto_increment_increment=1
      auto_increment_offset=1
      innodb_buffer_pool_size=1G
      max_connections=2000
      character_set_server=utf8
    autoRecovery: true
  haproxy:
    enabled: true
    size: 1
    image: percona/haproxy:2.8.17
    readinessProbes:
      initialDelaySeconds: 30
      timeoutSeconds: 10
      periodSeconds: 10
      failureThreshold: 30
    livenessProbes:
      initialDelaySeconds: 60
      timeoutSeconds: 10
      periodSeconds: 10
      failureThreshold: 30
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 256Mi
        cpu: 200m
