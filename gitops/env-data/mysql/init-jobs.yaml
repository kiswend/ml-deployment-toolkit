apiVersion: batch/v1
kind: Job
metadata:
  name: init-central-ledger-db
  namespace: mojaloop
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-mysql
          image: mysql:8.0
          command:
            - sh
            - -c
            - |
              until mysql -h central-ledger-db-haproxy -P 3306 -u root -p"$MYSQL_ROOT_PASSWORD" -e 'SELECT 1' 2>/dev/null; do
                echo "Waiting for central-ledger-db..."
                sleep 5
              done
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: central-ledger-db-secrets
                  key: root
      containers:
        - name: init-db
          image: mysql:8.0
          command:
            - sh
            - -c
            - |
              mysql -h central-ledger-db-haproxy -P 3306 -u root -p"$MYSQL_ROOT_PASSWORD" <<'EOF'
              CREATE DATABASE IF NOT EXISTS central_ledger CHARACTER SET utf8 COLLATE utf8_general_ci;
              CREATE USER IF NOT EXISTS 'central_ledger'@'%' IDENTIFIED BY '${mysql_central_ledger_password}';
              GRANT ALL PRIVILEGES ON central_ledger.* TO 'central_ledger'@'%';
              FLUSH PRIVILEGES;
              EOF
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: central-ledger-db-secrets
                  key: root
---
apiVersion: batch/v1
kind: Job
metadata:
  name: init-account-lookup-db
  namespace: mojaloop
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-mysql
          image: mysql:8.0
          command:
            - sh
            - -c
            - |
              until mysql -h account-lookup-db-haproxy -P 3306 -u root -p"$MYSQL_ROOT_PASSWORD" -e 'SELECT 1' 2>/dev/null; do
                echo "Waiting for account-lookup-db..."
                sleep 5
              done
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: account-lookup-db-secrets
                  key: root
      containers:
        - name: init-db
          image: mysql:8.0
          command:
            - sh
            - -c
            - |
              mysql -h account-lookup-db-haproxy -P 3306 -u root -p"$MYSQL_ROOT_PASSWORD" <<'EOF'
              CREATE DATABASE IF NOT EXISTS account_lookup CHARACTER SET utf8 COLLATE utf8_general_ci;
              CREATE USER IF NOT EXISTS 'account_lookup'@'%' IDENTIFIED BY '${mysql_account_lookup_password}';
              GRANT ALL PRIVILEGES ON account_lookup.* TO 'account_lookup'@'%';

              CREATE DATABASE IF NOT EXISTS oracle_msisdn CHARACTER SET utf8 COLLATE utf8_general_ci;
              CREATE USER IF NOT EXISTS 'oracle_msisdn'@'%' IDENTIFIED BY '${mysql_oracle_msisdn_password}';
              GRANT ALL PRIVILEGES ON oracle_msisdn.* TO 'oracle_msisdn'@'%';

              FLUSH PRIVILEGES;
              EOF
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: account-lookup-db-secrets
                  key: root
