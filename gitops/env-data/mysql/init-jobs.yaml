apiVersion: batch/v1
kind: Job
metadata:
  name: init-central-ledger-db
  namespace: mojaloop
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-mysql
          image: mysql:8.0
          command:
            - sh
            - -c
            - |
              HOST=central-ledger-db-haproxy
              EXPECTED_SIZE=1
              echo "Waiting for MySQL connectivity..."
              until mysql -h $HOST -P 3306 -u root -p"$MYSQL_ROOT_PASSWORD" -e 'SELECT 1' 2>/dev/null; do
                echo "Waiting for $HOST..."
                sleep 5
              done
              echo "MySQL reachable. Waiting for PXC cluster (wsrep_cluster_size=$EXPECTED_SIZE)..."
              while true; do
                SIZE=$(mysql -h $HOST -P 3306 -u root -p"$MYSQL_ROOT_PASSWORD" -Nse "SHOW GLOBAL STATUS LIKE 'wsrep_cluster_size'" 2>/dev/null | awk '{print $2}')
                if [ "$SIZE" = "$EXPECTED_SIZE" ]; then
                  echo "Cluster size=$EXPECTED_SIZE. Settling for 30s (HAProxy reload buffer)..."
                  sleep 30
                  SIZE=$(mysql -h $HOST -P 3306 -u root -p"$MYSQL_ROOT_PASSWORD" -Nse "SHOW GLOBAL STATUS LIKE 'wsrep_cluster_size'" 2>/dev/null | awk '{print $2}')
                  if [ "$SIZE" = "$EXPECTED_SIZE" ]; then
                    echo "PXC cluster stable."
                    break
                  fi
                  echo "Cluster size changed to $SIZE during settling. Retrying..."
                else
                  echo "wsrep_cluster_size=$SIZE (expected $EXPECTED_SIZE), waiting..."
                  sleep 5
                fi
              done
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: central-ledger-db-secrets
                  key: root
      containers:
        - name: init-db
          image: mysql:8.0
          command:
            - sh
            - -c
            - |
              mysql -h central-ledger-db-haproxy -P 3306 -u root -p"$MYSQL_ROOT_PASSWORD" <<'EOF'
              CREATE DATABASE IF NOT EXISTS central_ledger CHARACTER SET utf8 COLLATE utf8_general_ci;
              CREATE USER IF NOT EXISTS 'central_ledger'@'%' IDENTIFIED BY '${mysql_central_ledger_password}';
              GRANT ALL PRIVILEGES ON central_ledger.* TO 'central_ledger'@'%';
              FLUSH PRIVILEGES;
              EOF
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: central-ledger-db-secrets
                  key: root
---
