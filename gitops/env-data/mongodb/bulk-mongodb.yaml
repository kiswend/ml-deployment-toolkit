apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: bulk-mongodb
  namespace: mojaloop
spec:
  crVersion: "1.21.0"
  image: percona/percona-server-mongodb:7.0
  allowUnsafeConfigurations: true
  secrets:
    users: bulk-mongodb-secrets
  users:
    - name: mlos
      db: mlos
      roles:
        - name: readWrite
          db: mlos
      passwordSecretRef:
        name: bulk-mongodb-app-secrets
        key: MONGODB_APP_PASSWORD
    - name: ttk
      db: ttk
      roles:
        - name: readWrite
          db: ttk
      passwordSecretRef:
        name: bulk-mongodb-app-secrets
        key: MONGODB_APP_PASSWORD
    - name: reporting
      db: reporting_events
      roles:
        - name: readWrite
          db: reporting_events
      passwordSecretRef:
        name: bulk-mongodb-app-secrets
        key: MONGODB_APP_PASSWORD
  replsets:
    - name: rs0
      size: 3
      resources:
        requests:
          memory: 512Mi
          cpu: 250m
        limits:
          memory: 1Gi
          cpu: 500m
      volumeSpec:
        persistentVolumeClaim:
          resources:
            requests:
              storage: 3Gi
  sharding:
    enabled: false
