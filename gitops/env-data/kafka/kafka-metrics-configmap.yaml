apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-metrics
  namespace: mojaloop
data:
  kafka-metrics-config.yml: |
    lowercaseOutputName: true
    lowercaseOutputLabelNames: true
    rules:
      # Broker topic metrics
      - pattern: kafka.server<type=BrokerTopicMetrics, name=(.+), topic=(.+)><>Count
        name: kafka_server_brokertopicmetrics_$1_total
        type: COUNTER
        labels:
          topic: "$2"
      - pattern: kafka.server<type=BrokerTopicMetrics, name=(.+)><>Count
        name: kafka_server_brokertopicmetrics_$1_total
        type: COUNTER
      # Request metrics
      - pattern: kafka.network<type=RequestMetrics, name=RequestsPerSec, request=(.+), version=([0-9]+)><>Count
        name: kafka_network_requestmetrics_requestspersec_total
        type: COUNTER
        labels:
          request: "$1"
          version: "$2"
      # Under-replicated partitions
      - pattern: kafka.server<type=ReplicaManager, name=UnderReplicatedPartitions><>Value
        name: kafka_server_replicamanager_underreplicatedpartitions
        type: GAUGE
      # ISR shrink/expand
      - pattern: kafka.server<type=ReplicaManager, name=(.+)><>Count
        name: kafka_server_replicamanager_$1_total
        type: COUNTER
      # Partition count
      - pattern: kafka.server<type=ReplicaManager, name=PartitionCount><>Value
        name: kafka_server_replicamanager_partitioncount
        type: GAUGE
      # Leader count
      - pattern: kafka.server<type=ReplicaManager, name=LeaderCount><>Value
        name: kafka_server_replicamanager_leadercount
        type: GAUGE
      # Active controller count
      - pattern: kafka.controller<type=KafkaController, name=ActiveControllerCount><>Value
        name: kafka_controller_kafkacontroller_activecontrollercount
        type: GAUGE
      # Offline partitions
      - pattern: kafka.controller<type=KafkaController, name=OfflinePartitionsCount><>Value
        name: kafka_controller_kafkacontroller_offlinepartitionscount
        type: GAUGE
      # Log size
      - pattern: kafka.log<type=Log, name=Size, topic=(.+), partition=(.+)><>Value
        name: kafka_log_log_size
        type: GAUGE
        labels:
          topic: "$1"
          partition: "$2"
      # Consumer group lag
      - pattern: kafka.server<type=FetcherLagMetrics, name=ConsumerLag, clientId=(.+), topic=(.+), partition=(.+)><>Value
        name: kafka_server_fetcherlagmetrics_consumerlag
        type: GAUGE
        labels:
          clientId: "$1"
          topic: "$2"
          partition: "$3"
