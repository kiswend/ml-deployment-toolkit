apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Shared HelmRepository
  - grafana-helmrepo.yaml

  # Thanos (rendered from kube-thanos Jsonnet)
  - thanos/

  # ExternalSecrets
  - loki/externalsecret.yaml
  - tempo/externalsecret.yaml

  # HelmReleases
  - loki/helmrelease.yaml
  - tempo/helmrelease.yaml
  - grafana/helmrelease.yaml

  # Grafana Dashboards — Infrastructure
  - grafana/dashboards/infrastructure/node-overview.yaml
  - grafana/dashboards/infrastructure/kubernetes-cluster.yaml
  - grafana/dashboards/infrastructure/pod-resources.yaml

  # Grafana Dashboards — Data Layer
  - grafana/dashboards/data-layer/mysql-overview.yaml
  - grafana/dashboards/data-layer/pxc-galera-cluster.yaml
  - grafana/dashboards/data-layer/redis-overview.yaml
  - grafana/dashboards/data-layer/kafka-overview.yaml

  # Grafana Dashboards — Mojaloop
  - grafana/dashboards/mojaloop/transfer-pipeline.yaml
  - grafana/dashboards/mojaloop/account-lookup-service.yaml
  - grafana/dashboards/mojaloop/nodejs-runtime.yaml
