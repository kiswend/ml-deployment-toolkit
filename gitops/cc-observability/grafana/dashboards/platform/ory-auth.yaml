apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-ory-auth
  namespace: observability
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Platform"
data:
  ory-auth.json: |
    {
      "uid": "platform-ory-auth",
      "title": "Ory Auth (Kratos + Keto)",
      "tags": ["platform", "ory", "kratos", "keto", "auth"],
      "timezone": "utc",
      "editable": true,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "schemaVersion": 39,
      "templating": {
        "list": [
          {
            "name": "cluster_name",
            "type": "query",
            "datasource": { "uid": "thanos" },
            "query": "label_values(http_requests_total{namespace=\"ory\"}, cluster_name)",
            "refresh": 2,
            "includeAll": false,
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "title": "Kratos Requests/s",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": { "defaults": { "unit": "ops", "decimals": 1 } },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{cluster_name=\"$cluster_name\",app=\"kratos\"}[$__rate_interval]))",
              "legendFormat": ""
            }
          ],
          "options": { "colorMode": "none", "graphMode": "area" }
        },
        {
          "title": "Kratos 5xx/s",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 0.1 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_statuses_total{cluster_name=\"$cluster_name\",app=\"kratos\",status_bucket=\"5xx\"}[$__rate_interval])) or vector(0)",
              "legendFormat": ""
            }
          ],
          "options": { "colorMode": "background", "graphMode": "none" }
        },
        {
          "title": "Keto gRPC Checks/s",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": { "defaults": { "unit": "ops", "decimals": 1 } },
          "targets": [
            {
              "expr": "sum(rate(grpc_server_handled_total{cluster_name=\"$cluster_name\",grpc_service=~\".*CheckService\"}[$__rate_interval]))",
              "legendFormat": ""
            }
          ],
          "options": { "colorMode": "none", "graphMode": "area" }
        },
        {
          "title": "Keto gRPC Errors/s",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 0.1 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum(rate(grpc_server_handled_total{cluster_name=\"$cluster_name\",grpc_code!=\"OK\"}[$__rate_interval])) or vector(0)",
              "legendFormat": ""
            }
          ],
          "options": { "colorMode": "background", "graphMode": "none" }
        },
        {
          "title": "Kratos Request Rate by Endpoint",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": { "defaults": { "unit": "ops", "custom": { "fillOpacity": 20 } } },
          "targets": [
            {
              "expr": "topk(10, sum by (endpoint) (rate(http_requests_total{cluster_name=\"$cluster_name\",app=\"kratos\"}[$__rate_interval])))",
              "legendFormat": "{{endpoint}}"
            }
          ]
        },
        {
          "title": "Kratos Error Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": { "defaults": { "unit": "ops", "custom": { "fillOpacity": 20, "stacking": { "mode": "normal" } } } },
          "targets": [
            {
              "expr": "sum by (status_bucket) (rate(http_requests_statuses_total{cluster_name=\"$cluster_name\",app=\"kratos\"}[$__rate_interval]))",
              "legendFormat": "{{status_bucket}}"
            }
          ]
        },
        {
          "title": "Kratos Request Latency",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "fillOpacity": 10 } } },
          "targets": [
            {
              "expr": "histogram_quantile(0.5, sum(rate(http_requests_duration_seconds_bucket{cluster_name=\"$cluster_name\",app=\"kratos\"}[$__rate_interval])) by (le))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.9, sum(rate(http_requests_duration_seconds_bucket{cluster_name=\"$cluster_name\",app=\"kratos\"}[$__rate_interval])) by (le))",
              "legendFormat": "p90"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_requests_duration_seconds_bucket{cluster_name=\"$cluster_name\",app=\"kratos\"}[$__rate_interval])) by (le))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "title": "Kratos Latency by Endpoint (p99)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "fillOpacity": 10 } } },
          "targets": [
            {
              "expr": "topk(5, histogram_quantile(0.99, sum by (endpoint, le) (rate(http_response_time_seconds_bucket{cluster_name=\"$cluster_name\",app=\"kratos\"}[$__rate_interval]))))",
              "legendFormat": "{{endpoint}}"
            }
          ]
        },
        {
          "title": "Keto gRPC Check Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 20 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": { "defaults": { "unit": "ops", "custom": { "fillOpacity": 20 } } },
          "targets": [
            {
              "expr": "sum by (grpc_code) (rate(grpc_server_handled_total{cluster_name=\"$cluster_name\",grpc_service=~\".*CheckService\"}[$__rate_interval]))",
              "legendFormat": "{{grpc_code}}"
            }
          ]
        },
        {
          "title": "Keto gRPC Check Latency",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 20 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "fillOpacity": 10 } } },
          "targets": [
            {
              "expr": "histogram_quantile(0.5, sum(rate(grpc_server_handling_seconds_bucket{cluster_name=\"$cluster_name\",grpc_service=~\".*CheckService\"}[$__rate_interval])) by (le))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.9, sum(rate(grpc_server_handling_seconds_bucket{cluster_name=\"$cluster_name\",grpc_service=~\".*CheckService\"}[$__rate_interval])) by (le))",
              "legendFormat": "p90"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(grpc_server_handling_seconds_bucket{cluster_name=\"$cluster_name\",grpc_service=~\".*CheckService\"}[$__rate_interval])) by (le))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "title": "Keto gRPC Rate by Service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 20 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": { "defaults": { "unit": "ops", "custom": { "fillOpacity": 20 } } },
          "targets": [
            {
              "expr": "sum by (grpc_service) (rate(grpc_server_handled_total{cluster_name=\"$cluster_name\"}[$__rate_interval]))",
              "legendFormat": "{{grpc_service}}"
            }
          ]
        },
        {
          "title": "Goroutines",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 28 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "fillOpacity": 10 } } },
          "targets": [
            {
              "expr": "go_goroutines{cluster_name=\"$cluster_name\",namespace=\"ory\"}",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "title": "Memory Allocated",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 28 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": { "defaults": { "unit": "bytes", "custom": { "fillOpacity": 10 } } },
          "targets": [
            {
              "expr": "go_memstats_alloc_bytes{cluster_name=\"$cluster_name\",namespace=\"ory\"}",
              "legendFormat": "{{pod}}"
            }
          ]
        }
      ]
    }
