apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: vault
---
# RBAC: allow vault SA to manage secrets in vault ns (for unseal keys)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-secrets
  namespace: vault
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-secrets
  namespace: vault
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault
roleRef:
  kind: Role
  name: vault-secrets
  apiGroup: rbac.authorization.k8s.io
---
# RBAC: allow vault SA to review tokens (for Kubernetes auth method)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault
roleRef:
  kind: ClusterRole
  name: system:auth-delegator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: vault.banzaicloud.com/v1alpha1
kind: Vault
metadata:
  name: vault
  namespace: vault
spec:
  size: 1
  image: hashicorp/vault:1.18.4
  bankVaultsImage: ghcr.io/bank-vaults/bank-vaults:v1.31.3

  serviceType: ClusterIP
  serviceAccount: vault

  # Auto-unseal using K8s secret (operator stores unseal keys automatically)
  unsealConfig:
    options:
      preFlightChecks: true
    kubernetes:
      secretNamespace: vault

  # Vault server configuration
  config:
    storage:
      file:
        path: "/vault/file"
    listener:
      tcp:
        address: "0.0.0.0:8200"
        tls_disable: true
    api_addr: http://vault.vault:8200
    ui: true

  # Declarative Vault configuration (applied by bank-vaults sidecar after unseal)
  externalConfig:
    policies:
      - name: mcm-policy
        rules: |
          path "pki/*" {
            capabilities = ["create", "read", "update", "delete", "list", "sudo"]
          }
          path "secret/data/mcm/*" {
            capabilities = ["create", "read", "update", "delete", "list"]
          }
          path "secret/metadata/mcm/*" {
            capabilities = ["read", "list"]
          }
          path "secret/data/whitelist*" {
            capabilities = ["create", "read", "update", "delete", "list"]
          }
          path "secret/metadata/whitelist*" {
            capabilities = ["read", "list"]
          }
          path "secret/data/onboarding_pm4mls*" {
            capabilities = ["create", "read", "update", "delete", "list"]
          }
          path "secret/metadata/onboarding_pm4mls*" {
            capabilities = ["read", "list"]
          }
      - name: allow_secrets
        rules: |
          path "secret/*" {
            capabilities = ["create", "read", "update", "delete", "list"]
          }

    auth:
      - type: kubernetes
        roles:
          - name: mcm
            bound_service_account_names:
              - mcm
              - mcm-connection-manager-api
              - vault-agent
            bound_service_account_namespaces:
              - mcm
            policies: mcm-policy
            ttl: 1h
          - name: external-secrets
            bound_service_account_names:
              - external-secrets-external-secrets
            bound_service_account_namespaces:
              - external-secrets
            policies: allow_secrets
            ttl: 1h

    secrets:
      - path: secret
        type: kv
        description: "KV-v2 secret store"
        options:
          version: 2
      - path: pki
        type: pki
        description: "MCM PKI for DFSP certificates"
        configuration:
          config:
            - name: urls
              issuing_certificates: "http://vault.vault:8200/v1/pki/ca"
              crl_distribution_points: "http://vault.vault:8200/v1/pki/crl"
          root/generate:
            - name: internal
              common_name: "Mojaloop Hub CA"
              key_type: rsa
              key_bits: 4096
              ttl: 87600h
              organization: "Mojaloop"
              exclude_cn_from_sans: true
              create_only: true
          roles:
            - name: server-cert-role
              allowed_domains:
                - "${domain}"
              allow_subdomains: true
              max_ttl: 43800h
            - name: client-cert-role
              allow_any_name: true
              max_ttl: 43800h
              client_flag: true
              server_flag: false

    startupSecrets:
      - type: kv
        path: secret/data/kratos
        data:
          data:
            dsn: "mysql://kratos:${kratos_db_password}@tcp(${mysql_host}:${mysql_port})/kratos?max_conns=20&max_idle_conns=4"
            secretsCipher: "${kratos_secrets_cipher}"
            secretsCookie: "${kratos_secrets_cookie}"
            secretsCSRFCookie: "${kratos_secrets_csrf_cookie}"
            secretsDefault: "${kratos_secrets_default}"
            smtpConnectionURI: "smtps://test:test@mailslurper:1025/?skip_ssl_verify=true"
      - type: kv
        path: secret/data/keto
        data:
          data:
            dsn: "mysql://keto:${keto_db_password}@tcp(${mysql_host}:${mysql_port})/keto?max_conns=20&max_idle_conns=4"
      - type: kv
        path: secret/data/finance-portal
        data:
          data:
            role_assign_svc_secret: "${role_assign_svc_secret}"
            mongodb_app_password: "${mongodb_app_password}"

  # Persistent storage for Vault data
  volumeMounts:
    - name: vault-file
      mountPath: /vault/file

  volumes:
    - name: vault-file
      persistentVolumeClaim:
        claimName: vault-file

  volumeClaimTemplates:
    - metadata:
        name: vault-file
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
