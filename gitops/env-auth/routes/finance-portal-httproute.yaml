  name: finance-portal
  namespace: ory
spec:
  parentRefs:
    - name: main-gateway
      namespace: platform-system
  hostnames:
    - "finance-portal.${domain}"
  rules:
    - backendRefs:
        - name: ory-oathkeeper-proxy
          port: 4455
