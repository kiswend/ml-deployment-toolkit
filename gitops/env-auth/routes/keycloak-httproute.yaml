apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
spec:
  parentRefs:
    - name: main-gateway
      namespace: platform-system
  hostnames:
    - "keycloak.${domain}"
  rules:
    - backendRefs:
        - name: keycloak-service
          port: 8080
