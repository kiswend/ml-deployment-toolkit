apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: mojaloop-charts
  namespace: flux-system
spec:
  interval: 24h
  url: https://mojaloop.github.io/charts/repo
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bof
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: bof
      version: "5.1.0"
      sourceRef:
        kind: HelmRepository
        name: mojaloop-charts
      interval: 12h
  targetNamespace: ory
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    security-role-perm-operator-svc:
      enabled: true
      config:
        ketoReadUrl: "http://keto-read.ory.svc.cluster.local:80"
        ketoWriteUrl: "http://keto-write.ory.svc.cluster.local:80"
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

    # Disable sub-charts that are deployed separately
    security-hub-bop-api-svc:
      enabled: false
    security-hub-bop-kratos-svc:
      enabled: false
    security-hub-bop-shell-svc:
      enabled: false
