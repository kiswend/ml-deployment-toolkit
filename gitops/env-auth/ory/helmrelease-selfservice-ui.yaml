apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kratos-selfservice-ui
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: kratos-selfservice-ui-node
      version: "0.39.0"
      sourceRef:
        kind: HelmRepository
        name: ory
      interval: 12h
  targetNamespace: ory
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  dependsOn:
    - name: kratos
  values:
    fullnameOverride: "kratos-ui"

    secret:
      enabled: false
      nameOverride: kratos-secret

    config:
      csrfCookieName: "__HOST-auth.${domain}-x-csrf-token"

    kratosAdminUrl: "http://kratos-admin"
    kratosPublicUrl: "http://kratos-public"
    kratosBrowserUrl: "https://auth.${domain}/kratos"

    jwksUrl: "http://oathkeeper-api"

    projectName: "SecureApp"
