apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kratos-selfservice-ui
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: kratos-selfservice-ui-node
      version: "0.39.0"
      sourceRef:
        kind: HelmRepository
        name: ory
      interval: 12h
  targetNamespace: ory
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    kratosPublicUrl: "http://kratos-public.ory.svc.cluster.local:80"
    kratosBrowserUrl: "https://auth.${domain}"
    config:
      csrfCookieName: "__HOST-ory_kratos_csrf"

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
