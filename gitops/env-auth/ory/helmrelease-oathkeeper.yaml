apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oathkeeper
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: oathkeeper
      version: "0.39.0"
      sourceRef:
        kind: HelmRepository
        name: ory
      interval: 12h
  targetNamespace: ory
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    global:
      ory:
        oathkeeper:
          maester:
            mode: controller

    fullnameOverride: "oathkeeper"

    oathkeeper:
      config:
        log:
          level: info
          format: json
        access_rules:
          matching_strategy: regexp

        authenticators:
          jwt:
            enabled: true
            config:
              jwks_urls:
                - "https://keycloak.${domain}/realms/hub-operators/protocol/openid-connect/certs"
          cookie_session:
            enabled: true
            config:
              check_session_url: http://kratos-public/sessions/whoami
              preserve_path: true
              extra_from: "@this"
              subject_from: "identity.traits.subject"
              only:
              - ory_kratos_session
          anonymous:
            enabled: true
            config:
              subject: guest
          noop:
            enabled: true

        authorizers:
          allow:
            enabled: true
          keto_engine_acp_ory:
            enabled: true
            config:
              base_url: "http://keto-read"
              required_action: "read"
              required_resource: "unknown"
              flavor: "regex"
          remote_json:
            enabled: true
            config:
              remote: http://keto-read/relation-tuples/check
              payload: |
                {
                  "subject": "{{ print .Subject }}",
                  "resource": "{{ printIndex .MatchContext.RegexpCaptureGroups 0 }}"
                }

        mutators:
          id_token:
            enabled: true
            config:
              issuer_url: http://oathkeeper-api:4456/
              jwks_url: http://oathkeeper-api:4456/.well-known/jwks.json
          header:
            enabled: true
            config:
              headers:
                X-User: '{{ print .Subject }}'
                X-Extra: '{{ print .Extra }}'
                X-Email: '{{ print (((.Extra.identity).traits).email) }}'
                X-Roles: '{{ toJson (((.Extra.identity).traits).roles) }}'
          noop:
            enabled: true

        errors:
          fallback:
            - json
          handlers:
            json:
              enabled: true
              config:
                verbose: true
            redirect:
              enabled: false

        serve:
          proxy:
            port: 4455
          api:
            port: 4456

      managedAccessRules: false

    maester:
      enabled: true
      oathkeeperFullnameOverride: 'oathkeeper'

    oathkeeper-maester:
      fullnameOverride: 'oathkeeper-maester'
      oathkeeperFullnameOverride: 'oathkeeper'
      deployment:
        envs:
        - name: authorizersAvailable
          value: allow,deny,noop,remote_json,keto_engine_acp_ory

    # Access rules are managed via Rule CRDs (picked up by maester controller),
    # not inline. See gitops/env-app/ory-blank-rule.yaml and future Rule CRDs.

    service:
      proxy:
        enabled: true
        port: 4455
      api:
        enabled: true
        port: 4456
