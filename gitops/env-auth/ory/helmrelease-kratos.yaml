apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ory
  namespace: flux-system
spec:
  interval: 24h
  url: https://k8s.ory.sh/helm/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kratos
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: kratos
      version: "0.55.0"
      sourceRef:
        kind: HelmRepository
        name: ory
      interval: 12h
  targetNamespace: ory
  timeout: 15m
  install:
    createNamespace: false
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
      strategy: uninstall
  values:
    fullnameOverride: "kratos"

    secret:
      enabled: false
      nameOverride: kratos-secret

    courier:
      enabled: false

    deployment:
      extraInitContainers: |
        - name: wait-for-db
          image: percona/percona-xtradb-cluster:8.0.44-35.1
          command: [sh, -c]
          args:
            - |
              # Extract host, port, user, password from DSN
              # DSN format: mysql://user:pass@tcp(host:port)/db?params
              DB_USER=$(echo "$DSN" | sed 's|mysql://\([^:]*\):.*|\1|')
              DB_PASS=$(echo "$DSN" | sed 's|mysql://[^:]*:\([^@]*\)@.*|\1|')
              HOST=$(echo "$DSN" | sed 's|.*tcp(\([^:]*\):.*|\1|')
              PORT=$(echo "$DSN" | sed 's|.*tcp([^:]*:\([^)]*\)).*|\1|')
              DB=$(echo "$DSN" | sed 's|.*/\([^?]*\).*|\1|')
              echo "Waiting for MySQL connectivity to $DB..."
              until mysql -h "$HOST" -P "$PORT" -u "$DB_USER" -p"$DB_PASS" -e "SELECT 1" "$DB" 2>/dev/null; do
                echo "Waiting for $DB database..."
                sleep 5
              done
              echo "MySQL reachable. Verifying DDL readiness..."
              STABLE=0
              while [ $STABLE -lt 3 ]; do
                if mysql -h "$HOST" -P "$PORT" -u "$DB_USER" -p"$DB_PASS" "$DB" \
                  -e "CREATE TABLE IF NOT EXISTS __init_check (id INT PRIMARY KEY) ENGINE=InnoDB; DROP TABLE IF EXISTS __init_check;" 2>/dev/null; then
                  STABLE=$((STABLE + 1))
                  echo "DDL check passed ($STABLE/3)"
                else
                  STABLE=0
                  echo "DDL not ready, retrying..."
                fi
                sleep 2
              done
              echo "Database ready!"
          env:
            - name: DSN
              valueFrom:
                secretKeyRef:
                  name: kratos-secret
                  key: dsn

    service:
      admin:
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "4434"
          prometheus.io/path: "/metrics/prometheus"

    kratos:
      automigration:
        enabled: true
        type: initContainer

      identitySchemas:
        "identity.default.schema.json": |
          {
            "$id": "https://mojaloop.io/kratos-schema/identity.schema.json",
            "$schema": "http://json-schema.org/draft-07/schema#",
            "title": "Person",
            "type": "object",
            "properties": {
              "traits": {
                "type": "object",
                "properties": {
                  "email": {
                    "title": "E-Mail",
                    "type": "string",
                    "format": "email"
                  },
                  "subject": {
                    "title": "Subject",
                    "type": "string"
                  },
                  "name": {
                    "title": "Name",
                    "type": "string"
                  },
                  "roles": {
                    "title": "User Roles",
                    "type": "array",
                    "items": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          }
        "role-injection-body.jsonnet": |
          function(ctx) {
            identity_id: ctx.identity.id,
            user_subject: ctx.identity.traits.subject
          }

      config:
        dsn: "mysql://kratos:${kratos_db_password}@tcp(${mysql_host}:${mysql_port})/kratos?max_conns=20&max_idle_conns=4"

        courier:
          smtp:
            connection_uri: "smtps://test:test@mailslurper:1025/?skip_ssl_verify=true"

        identity:
          default_schema_id: default
          schemas:
            - id: default
              url: file:///etc/config/identity.default.schema.json

        serve:
          public:
            base_url: "https://auth.int.${domain}/kratos/"
            port: 4433
            cors:
              enabled: true
              allowed_origins:
              - "https://*.${domain}"
          admin:
            port: 4434

        selfservice:
          default_browser_return_url: "https://auth.int.${domain}/ui/welcome"
          allowed_return_urls:
            - "https://*.${domain}"

          methods:
            password:
              enabled: false
            oidc:
              enabled: true
              config:
                providers:
                  - id: hub-operators
                    provider: generic
                    client_id: hub-op
                    client_secret: "${hubop_oidc_secret}"
                    scope:
                      - openid
                      - profile
                      - email
                    mapper_url: "base64://bG9jYWwgY2xhaW1zID0gc3RkLmV4dFZhcignY2xhaW1zJyk7Cgp7CiAgaWRlbnRpdHk6IHsKICAgIHRyYWl0czogewogICAgICBlbWFpbDogY2xhaW1zLmVtYWlsLAogICAgICBuYW1lOiBjbGFpbXMubmFtZSwKICAgICAgc3ViamVjdDogY2xhaW1zLnN1YgogICAgfSwKICB9LAp9Cg=="
                    issuer_url: "https://keycloak.int.${domain}/realms/hub-operators"
                  - id: dfsps
                    provider: generic
                    client_id: dfsp-oidc
                    client_secret: "${dfsp_oidc_client_secret}"
                    scope:
                      - openid
                      - profile
                      - email
                    mapper_url: "base64://bG9jYWwgY2xhaW1zID0gc3RkLmV4dFZhcignY2xhaW1zJyk7Cgp7CiAgaWRlbnRpdHk6IHsKICAgIHRyYWl0czogewogICAgICBlbWFpbDogY2xhaW1zLmVtYWlsLAogICAgICBuYW1lOiBjbGFpbXMubmFtZSwKICAgICAgc3ViamVjdDogY2xhaW1zLnN1YgogICAgfSwKICB9LAp9Cg=="
                    issuer_url: "https://keycloak.int.${domain}/realms/dfsps"

          flows:
            login:
              ui_url: "https://auth.int.${domain}/ui/login"
              lifespan: 10m
              after:
                oidc:
                  default_browser_return_url: "https://auth.int.${domain}/ui/welcome"
                  hooks:
                    - hook: web_hook
                      config:
                        url: http://kratos-role-webhook.ory.svc.cluster.local/inject-roles
                        method: POST
                        body: file:///etc/config/role-injection-body.jsonnet
                        response:
                          parse: false
                        auth:
                          type: api_key
                          config:
                            name: Authorization
                            value: Bearer kratos-webhook-token
                            in: header

            registration:
              after:
                oidc:
                  hooks:
                    - hook: web_hook
                      config:
                        url: http://kratos-role-webhook.ory.svc.cluster.local/inject-roles
                        method: POST
                        body: file:///etc/config/role-injection-body.jsonnet
                        response:
                          parse: false
                        auth:
                          type: api_key
                          config:
                            name: Authorization
                            value: Bearer kratos-webhook-token
                            in: header
                    - hook: session

            logout:
              after:
                default_browser_return_url: "https://keycloak.int.${domain}/realms/hub-operators/protocol/openid-connect/logout"

            error:
              ui_url: "https://auth.int.${domain}/ui/error"

        log:
          level: debug
          format: text
          leak_sensitive_values: true

        ciphers:
          algorithm: xchacha20-poly1305

        hashers:
          algorithm: bcrypt
          bcrypt:
            cost: 8

        session:
          cookie:
            domain: "${domain}"
