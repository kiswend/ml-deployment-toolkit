apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keto
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: keto
      version: "0.39.0"
      sourceRef:
        kind: HelmRepository
        name: ory
      interval: 12h
  targetNamespace: ory
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    keto:
      automigration:
        enabled: true
      config:
        dsn: "mysql://keto:${keto_db_password}@tcp(auth-db-haproxy.mojaloop.svc.cluster.local:3306)/keto?max_conns=20&max_idle_conns=4"
        namespaces:
          - id: 0
            name: role
          - id: 1
            name: permission
          - id: 2
            name: participant
        serve:
          read:
            host: 0.0.0.0
            port: 4466
          write:
            host: 0.0.0.0
            port: 4467

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
