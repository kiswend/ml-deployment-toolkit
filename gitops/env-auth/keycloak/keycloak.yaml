# Keycloak admin credentials
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin-secret
  namespace: keycloak
type: Opaque
stringData:
  username: admin
  password: "${keycloak_admin_password}"
---
# Database credentials for Keycloak
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-secret
  namespace: keycloak
type: Opaque
stringData:
  username: keycloak
  password: "${keycloak_db_password}"
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  instances: 1
  image: quay.io/keycloak/keycloak:26.5.2
  db:
    vendor: mysql
    host: ${mysql_host}
    port: 3306
    database: keycloak
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password
  http:
    httpEnabled: true
  transaction:
    xaEnabled: false
  ingress:
    enabled: false
  hostname:
    hostname: "keycloak.int.${domain}"
    strict: false
    strictBackchannel: false
  additionalOptions:
    - name: proxy-headers
      value: xforwarded
  unsupported:
    podTemplate:
      metadata:
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "9000"
          prometheus.io/path: "/metrics"
      spec:
        initContainers:
          - name: build-keycloak
            image: quay.io/keycloak/keycloak:26.5.2
            command:
              - /bin/bash
              - -c
              - |
                /opt/keycloak/bin/kc.sh build --db=mysql --transaction-xa-enabled=false --health-enabled=true --metrics-enabled=true --event-metrics-user-enabled=true --http-relative-path=/
                cp -r /opt/keycloak/lib/quarkus/* /quarkus-build/
            resources:
              requests:
                memory: 512Mi
                cpu: 250m
              limits:
                memory: 768Mi
            volumeMounts:
              - name: quarkus-build
                mountPath: /quarkus-build
          - name: wait-for-db
            image: percona/percona-xtradb-cluster:8.0.44-35.1
            command:
              - sh
              - -c
              - |
                HOST=${mysql_host}
                echo "Waiting for MySQL connectivity..."
                until mysql -h $HOST -u "$DB_USER" -p"$DB_PASS" -e "SELECT 1" keycloak 2>/dev/null; do
                  echo "Waiting for keycloak database..."
                  sleep 5
                done
                echo "MySQL reachable. Verifying DDL readiness..."
                STABLE=0
                while [ $STABLE -lt 3 ]; do
                  if mysql -h $HOST -u "$DB_USER" -p"$DB_PASS" keycloak \
                    -e "CREATE TABLE IF NOT EXISTS __init_check (id INT PRIMARY KEY) ENGINE=InnoDB; DROP TABLE IF EXISTS __init_check;" 2>/dev/null; then
                    STABLE=$((STABLE + 1))
                    echo "DDL check passed ($STABLE/3)"
                  else
                    STABLE=0
                    echo "DDL not ready, retrying..."
                  fi
                  sleep 2
                done
                echo "Database ready!"
            env:
              - name: DB_USER
                valueFrom:
                  secretKeyRef:
                    name: keycloak-db-secret
                    key: username
              - name: DB_PASS
                valueFrom:
                  secretKeyRef:
                    name: keycloak-db-secret
                    key: password
        containers:
          - name: keycloak
            startupProbe:
              httpGet:
                path: /health/live
                port: 9000
              initialDelaySeconds: 20
              periodSeconds: 2
              failureThreshold: 300
            volumeMounts:
              - name: quarkus-build
                mountPath: /opt/keycloak/lib/quarkus
        volumes:
          - name: quarkus-build
            emptyDir: {}
