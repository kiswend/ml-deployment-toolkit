apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-dns
  namespace: flux-system
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/external-dns/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: "1.x"
      sourceRef:
        kind: HelmRepository
        name: external-dns
      interval: 12h
  targetNamespace: external-dns
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "7979"
    sources:
      - service
      - gateway-httproute
    provider:
      name: ${dns_provider}
    domainFilters:
      - ${domain}
    txtOwnerId: ${cluster_name}
    policy: sync
    env:
      - name: DO_TOKEN
        value: "${digitalocean_token}"
      - name: CF_API_TOKEN
        value: "${cloudflare_api_token}"
      - name: EXTERNAL_DNS_PDNS_SERVER
        value: "${powerdns_api_url}"
      - name: EXTERNAL_DNS_PDNS_API_KEY
        value: "${powerdns_api_key}"
