apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: finance-portal
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: finance-portal
      version: "5.1.x"
      sourceRef:
        kind: HelmRepository
        name: mojaloop-charts
      interval: 12h
  releaseName: fin-portal
  targetNamespace: mojaloop
  install:
    createNamespace: false
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
      strategy: uninstall
  values:
    global:
      adminApiSvc:
        host: moja-centralledger-service
        port: 80
      settlementSvc:
        host: moja-centralsettlement-service
        port: 80
      keto:
        readURL: "http://keto-read.ory.svc.cluster.local:80"
        writeURL: "http://keto-write.ory.svc.cluster.local:80"
      reportingDB:
        host: "${mysql_host}"
        port: 3306
        user: central_ledger
        database: central_ledger
        secret:
          name: mysqldb
          key: mysql-password
      reportingEventsDB:
        host: "${mongodb_host}"
        port: ${mongodb_port}
        user: reporting
        database: reporting_events
        secret:
          name: reporting-events-db-secret
          key: mongodb-password
      keycloak:
        url: "https://keycloak.int.${domain}"
        user: "role-assign-svc"
        secret:
          name: role-assign-svc-secret
          key: secret
        realm: "hub-operators"
      rolePermOperator:
        apiSvc:
          host: ory-bof-security-role-perm-operator-svc.ory.svc.cluster.local
          port: 80

    reporting-hub-bop-api-svc:
      enabled: true
      containerSecurityContext:
        enabled: false

    reporting-hub-bop-experience-api-svc:
      enabled: true

    reporting-hub-bop-shell:
      enabled: true
      ingress:
        enabled: false
      config:
        env:
          AUTH_MOCK_API: false
          REMOTE_API_BASE_URL: ''
          REMOTE_MOCK_API: false
          LOGIN_URL: "https://auth.int.${domain}/kratos/self-service/login/browser"
          LOGOUT_URL: "/kratos/self-service/logout/browser?return_to=https%3A%2F%2Fkeycloak.int.${domain}%2Frealms%2Fhub-operators%2Fprotocol%2Fopenid-connect%2Flogout"
          LOGIN_PROVIDER: keycloak
          AUTH_TOKEN_URL: "/kratos/sessions/whoami"
          AUTH_ENABLED: true
          REMOTE_1_URL: "https://finance-portal.int.${domain}/uis/iam"
          REMOTE_2_URL: "https://finance-portal.int.${domain}/uis/transfers"
          REMOTE_3_URL: "https://finance-portal.int.${domain}/uis/settlements"
          REMOTE_4_URL: "https://finance-portal.int.${domain}/uis/positions"
      configFiles:
        config.json:
          AUTH_API_BASE_URL: ''
          AUTH_MOCK_API: 'false'
          REMOTE_API_BASE_URL: ''
          REMOTE_MOCK_API: 'false'
          AUTH_ENABLED: 'true'
          LOGIN_URL: "https://auth.int.${domain}/kratos/self-service/login/browser"
          LOGIN_PROVIDER: keycloak
          LOGOUT_URL: "/kratos/self-service/logout/browser?return_to=https%3A%2F%2Fkeycloak.int.${domain}%2Frealms%2Fhub-operators%2Fprotocol%2Fopenid-connect%2Flogout"
          AUTH_TOKEN_URL: /kratos/sessions/whoami
        remotes.json:
          roles:
            path: /iam
            label: Roles
            menuComponent: Menu
            appComponent: App
            baseUrl: "https://finance-portal.int.${domain}/uis/iam"
            url: "https://finance-portal.int.${domain}/uis/iam/app.js"
            appName: reporting_hub_bop_role_ui
          transfers:
            path: /transfers
            label: Transfers
            menuComponent: Menu
            appComponent: App
            baseUrl: "https://finance-portal.int.${domain}/uis/transfers"
            url: "https://finance-portal.int.${domain}/uis/transfers/app.js"
            appName: reporting_hub_bop_trx_ui
          settlements:
            path: /settlements
            label: Settlements
            menuComponent: Menu
            appComponent: App
            baseUrl: "https://finance-portal.int.${domain}/uis/settlements"
            url: "https://finance-portal.int.${domain}/uis/settlements/app.js"
            appName: reporting_hub_bop_settlements_ui
          positions:
            path: /positions
            label: Financial Positions
            menuComponent: Menu
            appComponent: App
            baseUrl: "https://finance-portal.int.${domain}/uis/positions"
            url: "https://finance-portal.int.${domain}/uis/positions/app.js"
            appName: reporting_hub_bop_positions_ui

    reporting-hub-bop-role-ui:
      enabled: true
      ingress:
        enabled: false
      configFiles:
        runtime-env.js: |
          window.roleEnv = {
            REACT_APP_API_BASE_URL: 'https://finance-portal.int.${domain}/api/iam',
            REACT_APP_MOCK_API: 'false'
          };

    reporting-hub-bop-trx-ui:
      enabled: true
      ingress:
        enabled: false
      configFiles:
        runtime-env.js: |
          window.transferEnv = {
            REACT_APP_API_BASE_URL: 'https://finance-portal.int.${domain}/api/transfers',
            REACT_APP_MOCK_API: 'false'
          };

    reporting-hub-bop-settlements-ui:
      enabled: true
      ingress:
        enabled: false
      configFiles:
        runtime-env.js: |
          window.settlementEnv = {
            CENTRAL_LEDGER_ENDPOINT: 'https://finance-portal.int.${domain}/api/central-admin',
            CENTRAL_SETTLEMENTS_ENDPOINT: 'https://finance-portal.int.${domain}/api/central-settlements',
            REPORTING_API_ENDPOINT: 'https://finance-portal.int.${domain}/api/transfers',
            REPORTING_TEMPLATE_API_ENDPOINT: 'https://finance-portal.int.${domain}/api/reports/report-bilateral-settlement'
          };

    reporting-hub-bop-positions-ui:
      enabled: true
      ingress:
        enabled: false
      configFiles:
        runtime-env.js: |
          window.positionsEnv = {
            CENTRAL_LEDGER_ENDPOINT: 'https://finance-portal.int.${domain}/api/central-admin'
          };

    reporting-events-processor-svc:
      enabled: true
      kafka:
        host: "${kafka_host}"
        port: ${kafka_port}
        topicEvent: topic-event-audit
        consumerGroup: reporting_events_processor_consumer_group
        clientId: reporting_events_processor_consumer

    reporting-legacy-api:
      enabled: true
      containerSecurityContext:
        enabled: false
      install-templates: false
      auth: true
      config:
        env:
          VALIDATION_RETRY_COUNT: "10"
          VALIDATION_RETRY_INTERVAL_MS: "5000"
      reporting-k8s-templates:
        templates:
          settlement: true
          dfspSettlement: true
          dfspSettlementDetail: true
          reconciliationAmount: true
          settlementWindow: true
          settlementInitiation: true
          transactionReconciliation: true
          dfspSettlementStatement: true
          settlementAudit: true

    role-assignment-service:
      enabled: true
      ingress:
        enabled: false
      configFiles:
        default.json: {
            "ROLES_LIST": [
              "manager",
              "operator",
              "clerk",
              "financeManager",
              "dfspReconciliationReports",
              "audit",
              "mcmadmin"
            ],
            "AUTO_GRANT_PORTAL_ADMIN_ROLES": [
              "manager"
            ]
          }

    reporting-aggregator-svc:
      enabled: true
