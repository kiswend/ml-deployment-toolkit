---
# Central-admin participants (direct path, not /api/ prefixed)
apiVersion: oathkeeper.ory.sh/v1alpha1
kind: Rule
metadata:
  name: fp-central-admin
  namespace: ory
spec:
  match:
    url: <http|https>://finance-portal.int.${domain}/central-admin/<.*>
