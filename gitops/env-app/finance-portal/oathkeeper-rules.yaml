# Oathkeeper Rule CRDs for finance-portal API routes (auth required).
# Only API routes come through oathkeeper-proxy (via HTTPRoute).
# Shell, UIs, and Kratos are routed directly by the HTTPRoute.
#
# Auth: cookie_session + jwt for API endpoints.
# Authz: 'allow' for now — switch to 'remote_json' (Keto RBAC)
#        once ory-rbac-role-permissions.yaml is deployed and users assigned roles.
---
# API: transfers (reporting-hub-bop-api-svc)
apiVersion: oathkeeper.ory.sh/v1alpha1
kind: Rule
metadata:
  name: fp-api-transfers
  namespace: ory
spec:
  match:
    url: <http|https>://finance-portal.int.${domain}/api/transfers<.*>
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
  authenticators:
    - handler: jwt
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: header
  upstream:
    preserveHost: false
    url: http://fin-portal-reporting-hub-bop-api-svc.mojaloop.svc.cluster.local:80
---
# API: IAM / role-assignment-service (strip /api/iam → /)
apiVersion: oathkeeper.ory.sh/v1alpha1
kind: Rule
metadata:
  name: fp-api-iam
  namespace: ory
spec:
  match:
    url: <http|https>://finance-portal.int.${domain}/api/iam/<.*>
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
  authenticators:
    - handler: jwt
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: header
  upstream:
    preserveHost: false
    stripPath: /api/iam
    url: http://fin-portal-role-assignment-service.mojaloop.svc.cluster.local:80
---
# API: central-admin (experience-api-svc, strip /api → keeps /central-admin/)
apiVersion: oathkeeper.ory.sh/v1alpha1
kind: Rule
metadata:
  name: fp-api-central-admin
  namespace: ory
spec:
  match:
    url: <http|https>://finance-portal.int.${domain}/api/central-admin/<.*>
    methods:
      - GET
