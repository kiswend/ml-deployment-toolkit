      - PUT
      - DELETE
      - PATCH
  authenticators:
    - handler: jwt
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: header
  upstream:
    preserveHost: false
    stripPath: /api
    url: http://fin-portal-reporting-hub-bop-experience-api-svc.mojaloop.svc.cluster.local:80
---
