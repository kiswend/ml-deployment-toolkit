# IAM RBAC endpoints (users, participants, roles — for role-assignment UI)
apiVersion: oathkeeper.ory.sh/v1alpha1
kind: Rule
metadata:
  name: fp-iam-resources
  namespace: ory
spec:
  match:
    url: <http|https>://finance-portal.int.${domain}/<(users|participants|roles)(/.*)?>
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
  authenticators:
    - handler: jwt
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: header
  upstream:
    preserveHost: false
    url: http://fin-portal-role-assignment-service.mojaloop.svc.cluster.local:80
---
# Settlement windows (matches /settlementWindows before /settlements)
apiVersion: oathkeeper.ory.sh/v1alpha1
kind: Rule
metadata:
  name: fp-settlement-windows
  namespace: ory
spec:
  match:
    url: <http|https>://finance-portal.int.${domain}/settlementWindows<.*>
    methods:
      - GET
      - POST
  authenticators:
    - handler: jwt
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: header
  upstream:
    preserveHost: false
    url: http://moja-centralsettlement-service.mojaloop.svc.cluster.local:80
---
# Settlements (use /settlements/ with trailing slash to avoid matching /settlementWindows)
apiVersion: oathkeeper.ory.sh/v1alpha1
kind: Rule
metadata:
  name: fp-settlements
  namespace: ory
spec:
  match:
    url: <http|https>://finance-portal.int.${domain}/settlements<(/.*|$)>
    methods:
      - GET
      - POST
      - PUT
  authenticators:
    - handler: jwt
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: header
  upstream:
    preserveHost: false
    url: http://moja-centralsettlement-service.mojaloop.svc.cluster.local:80
