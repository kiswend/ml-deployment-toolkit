---
# Single DFSP get/update — admin OR DFSP member can view/update
apiVersion: oathkeeper.ory.sh/v1alpha1
kind: Rule
metadata:
  name: mcm-dfsp-single-get
  namespace: ory
spec:
  match:
    url: "<https>://mcm.int.${domain}/api/dfsps/<?!jwscerts|servercerts><[^/]+><$>"
    methods:
      - GET
      - PUT
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: remote_json
    config:
      remote: http://keto-batch-auth.ory.svc.cluster.local
      payload: |
        {
          "tuples": [
            {
              "namespace": "permission",
              "object": "dfspManage",
              "relation": "granted",
              "subject_id": "{{ print .Subject }}"
            },
            {
              "namespace": "role",
              "object": "dfsp:{{ printIndex .MatchContext.RegexpCaptureGroups 1 }}",
              "relation": "member",
              "subject_id": "{{ print .Subject }}"
            }
          ]
        }
  mutators:
    - handler: header
      config:
        headers:
          X-User: '{{ print .Subject }}'
          X-Email: '{{ print (((.Extra.identity).traits).email) }}'
          X-Roles: '{{ toJson (((.Extra.identity).traits).roles) }}'
          X-DFSP-ID: '{{ printIndex .MatchContext.RegexpCaptureGroups 1 }}'
  upstream:
    preserveHost: false
    url: http://mcm-connection-manager-api.mcm.svc.cluster.local:3001
    stripPath: ""
