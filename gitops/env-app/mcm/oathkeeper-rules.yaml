# MCM Oathkeeper Rule CRDs — fine-grained per-endpoint Keto permission checks
# Ported from legacy sw002-main, templatized with ${domain}
# Human users: cookie_session auth via mcm.int.${domain}
# Machine clients (PM4ML): JWT auth via mcm.ext.${domain}
---
# Authentication endpoints — open to authenticated users
apiVersion: oathkeeper.ory.sh/v1alpha1
kind: Rule
metadata:
  name: mcm-api-auth
  namespace: ory
spec:
  match:
    url: "<https>://mcm.int.${domain}/api/auth/<.*>"
    methods:
      - GET
      - POST
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: header
  upstream:
    preserveHost: false
    url: http://mcm-connection-manager-api.mcm.svc.cluster.local:3001
    stripPath: ""
---
# DFSP list — check dfspList permission
apiVersion: oathkeeper.ory.sh/v1alpha1
kind: Rule
metadata:
  name: mcm-dfsps-list
  namespace: ory
spec:
  match:
    url: "<https>://mcm.int.${domain}/api/dfsps<$>"
    methods:
      - GET
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: remote_json
    config:
      remote: http://keto-read.ory.svc.cluster.local:80/relation-tuples/check
      payload: |
        {
          "namespace": "permission",
          "object": "dfspList",
          "relation": "granted",
          "subject_id": "{{ print .Subject }}"
        }
  mutators:
    - handler: header
      config:
        headers:
          X-User: '{{ print .Subject }}'
          X-Email: '{{ print (((.Extra.identity).traits).email) }}'
          X-Roles: '{{ toJson (((.Extra.identity).traits).roles) }}'
  upstream:
    preserveHost: false
    url: http://mcm-connection-manager-api.mcm.svc.cluster.local:3001
    stripPath: ""
---
