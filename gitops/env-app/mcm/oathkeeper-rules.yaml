spec:
  match:
    url: "<https>://mcm.ext.${domain}/pm4mlapi/dfsps<$>"
    methods:
      - GET
  authenticators:
    - handler: jwt
      config:
        jwks_urls:
          - "http://hydra-public.ory.svc.cluster.local:4444/.well-known/jwks.json"
        trusted_issuers:
          - "https://hydra.ext.${domain}"
  authorizer:
    handler: remote_json
    config:
      remote: http://keto-read.ory.svc.cluster.local:80/relation-tuples/check
