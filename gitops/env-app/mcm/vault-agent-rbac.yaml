# ServiceAccount for Vault Agent in mcm namespace
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-agent
  namespace: mcm
---
# Role in mojaloop namespace — Vault Agent creates/manages DFSP resources
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-agent
  namespace: mojaloop
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumenvoyconfigs", "ciliumnetworkpolicies"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
# Bind vault-agent SA (mcm namespace) to the Role in mojaloop namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-agent
  namespace: mojaloop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-agent
subjects:
  - kind: ServiceAccount
    name: vault-agent
    namespace: mcm
