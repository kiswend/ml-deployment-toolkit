apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mcm
  namespace: flux-system
spec:
  interval: 10m
  chart:
    spec:
      chart: connection-manager
      version: "1.4.0"
      sourceRef:
        kind: HelmRepository
        name: mojaloop
      interval: 12h
  releaseName: mcm
  targetNamespace: mcm
  timeout: 10m
  install:
    createNamespace: false
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
      strategy: uninstall
  values:
    db:
      user: mcm
      passwordSecret: mcm-db-secret
      passwordSecretKey: mysql-password
      host: "${mysql_host}"
      port: 3306
      schema: mcm

    api:
      url: "https://mcm.int.${domain}"
      clientUrl: "https://mcm.int.${domain}"
      switchFQDN: "${domain}"
      switchId: "hub-${domain}"

      openid:
        enabled: true
        clientId: mcm-portal
        clientSecretName: mcm-oidc-client-secret
        clientSecretKey: secret

      keycloak:
        enabled: true
        baseUrl: "https://keycloak.int.${domain}"
        discoveryUrl: "https://keycloak.int.${domain}/realms/dfsps/.well-known/openid-configuration"
        adminClientId: mcm-portal
        adminClientSecretName: mcm-oidc-client-secret
        adminClientSecretKey: secret
        dfspsRealm: dfsps
        autoCreateAccounts: true

      certManager:
        enabled: true
        serverCertSecretName: extapi-tls
        serverCertSecretNamespace: mojaloop

      vault:
        auth:
          k8s:
            enabled: true
            token: /var/run/secrets/kubernetes.io/serviceaccount/token
            role: mcm
            mountPoint: kubernetes
        endpoint: "http://vault.vault.svc.cluster.local:8200"
        mounts:
          pki: pki
          kv: secret/mcm
          dfspClientCertBundle: secret/onboarding_pm4mls
          dfspInternalIPWhitelistBundle: secret/whitelist_pm4mls
          dfspExternalIPWhitelistBundle: secret/whitelist_fsps
        pkiServerRole: server-cert-role
        pkiClientRole: client-cert-role
        signExpiryHours: 43800

      serviceAccount:
        name: connection-manager-api
        externallyManaged: false

      keto:
        enabled: true
        writeUrl: http://keto-write.ory.svc.cluster.local:80

    ui:
      checkSessionUrl: "https://mcm.int.${domain}/kratos/sessions/whoami"
      loginUrl: "https://auth.int.${domain}/kratos/self-service/login/browser"
      loginProvider: keycloak
      logoutUrl: "/kratos/self-service/logout/browser?return_to=https%3A%2F%2Fkeycloak.int.${domain}%2Frealms%2Fdfsps%2Fprotocol%2Fopenid-connect%2Flogout"
      oauth:
        enabled: true
        hubOidcProviderUrl: "https://keycloak.int.${domain}/realms/dfsps/protocol/openid-connect"
        clientId: mcm-portal
        clientSecretName: mcm-oidc-client-secret
        clientSecretKey: secret

    migrations:
      enabled: true
      deletePolicy: before-hook-creation

    ingress:
      enabled: false
