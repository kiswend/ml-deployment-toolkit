# One-shot DB diagnostic (perf campaign): table sizes + statement digests.
# Read-only queries; output goes to pod logs. Remove after the campaign.
apiVersion: batch/v1
kind: Job
metadata:
  name: diag-db-20260702
  namespace: mojaloop
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mysql-diag
          image: mysql:8.0
          env:
            - name: MYSQL_PWD
              value: "${mysql_central_ledger_password}"
          command:
            - sh
            - -c
            - |
              M="mysql -h ${mysql_host} -P ${mysql_port} -u central_ledger --table"
              echo "=== TABLE SIZES (central_ledger) ==="
              $M -e "SELECT table_name, table_rows, ROUND((data_length+index_length)/1048576,1) AS mb
                     FROM information_schema.tables WHERE table_schema='central_ledger'
                     ORDER BY table_rows DESC LIMIT 15;" central_ledger
              echo "=== TOP STATEMENTS BY TOTAL TIME ==="
              $M -e "SELECT LEFT(digest_text,90) AS q, count_star AS calls,
                     ROUND(avg_timer_wait/1e9,1) AS avg_ms, ROUND(sum_timer_wait/1e12,1) AS total_s,
                     ROUND(sum_rows_examined/count_star) AS rows_exam_avg
                     FROM performance_schema.events_statements_summary_by_digest
                     WHERE schema_name='central_ledger' ORDER BY sum_timer_wait DESC LIMIT 15;" central_ledger
              echo "=== TOP STATEMENTS BY AVG TIME (calls>100) ==="
              $M -e "SELECT LEFT(digest_text,90) AS q, count_star AS calls,
                     ROUND(avg_timer_wait/1e9,1) AS avg_ms, ROUND(sum_rows_examined/count_star) AS rows_exam_avg
                     FROM performance_schema.events_statements_summary_by_digest
                     WHERE schema_name='central_ledger' AND count_star>100
                     ORDER BY avg_timer_wait DESC LIMIT 15;" central_ledger
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 128Mi}
