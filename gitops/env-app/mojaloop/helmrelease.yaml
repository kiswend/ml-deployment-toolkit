apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: mojaloop
  namespace: flux-system
spec:
  interval: 24h
  url: https://mojaloop.github.io/helm/repo
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mojaloop
  namespace: flux-system
spec:
  interval: 10m
  timeout: 30m
  chart:
    spec:
      chart: mojaloop
      version: "17.1.x"
      sourceRef:
        kind: HelmRepository
        name: mojaloop
      interval: 12h
  releaseName: moja
  targetNamespace: mojaloop
  storageNamespace: mojaloop
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: -1
      strategy: uninstall
  values:
    global:
      kafka:
        host: "${kafka_host}"
        port: ${kafka_port}

    # --- Central Ledger ---
    # Event SDK (configOverride.EVENT_SDKrc) enables audit event production to
    # Kafka topic-event-audit. The reporting-events-processor-svc consumes these
    # events and writes them to MongoDB, which the Finance Portal Transfers UI
    # queries. Without this config, no audit events are produced and the
    # Transfers page shows empty results.
    centralledger:
      centralledger-service:
        config:
          kafka_host: "${kafka_host}"
          kafka_port: ${kafka_port}
          db_host: "${mysql_host}"
          db_port: ${mysql_port}
          db_user: central_ledger
          db_password: "${mysql_central_ledger_password}"
          db_database: central_ledger
        init:
          enabled: true
        configOverride:
          .EVENT_SDKrc: &eventSdkConfig
            AUDIT: kafka
            KAFKA:
              PRODUCER:
                EVENT:
                  AUDIT:
                    config:
                      options:
                        messageCharset: utf8
                        sync: true
                      rdkafkaConf:
                        client.id: producer-event-audit
                        compression.type: lz4
                        dr_cb: false
                        event_cb: true
                        metadata.broker.list: "${kafka_host}:${kafka_port}"
                        queue.buffering.max.messages: 10000000
                        socket.keepalive.enable: true
                      topicConf:
                        partitioner: murmur2_random
                        request.required.acks: all
                  LOG:
                    config:
                      options:
                        messageCharset: utf8
                        sync: true
                      rdkafkaConf:
                        client.id: producer-event-log
                        compression.type: lz4
                        dr_cb: false
                        event_cb: true
                        metadata.broker.list: "${kafka_host}:${kafka_port}"
                        queue.buffering.max.messages: 10000000
                        socket.keepalive.enable: true
                      topicConf:
                        partitioner: murmur2_random
                        request.required.acks: all
                  TRACE:
                    config:
                      options:
                        messageCharset: utf8
                        sync: true
                      rdkafkaConf:
                        client.id: producer-event-trace
                        compression.type: lz4
                        dr_cb: false
                        event_cb: true
                        metadata.broker.list: "${kafka_host}:${kafka_port}"
                        queue.buffering.max.messages: 10000000
                        socket.keepalive.enable: true
                      topicConf:
                        partitioner: murmur2_random
                        request.required.acks: all
            LOG: 'off'
            TRACE: 'off'
      centralledger-handler-transfer-prepare:
        config:
          kafka_host: "${kafka_host}"
          kafka_port: ${kafka_port}
          db_host: "${mysql_host}"
          db_port: ${mysql_port}
          db_user: central_ledger
          db_password: "${mysql_central_ledger_password}"
          db_database: central_ledger
        configOverride:
          .EVENT_SDKrc: *eventSdkConfig
      centralledger-handler-transfer-position:
        config:
          kafka_host: "${kafka_host}"
          kafka_port: ${kafka_port}
          db_host: "${mysql_host}"
          db_port: ${mysql_port}
          db_user: central_ledger
          db_password: "${mysql_central_ledger_password}"
          db_database: central_ledger
        configOverride:
          .EVENT_SDKrc: *eventSdkConfig
      centralledger-handler-transfer-position-batch:
        config:
          kafka_host: "${kafka_host}"
          kafka_port: ${kafka_port}
          db_host: "${mysql_host}"
          db_port: ${mysql_port}
          db_user: central_ledger
          db_password: "${mysql_central_ledger_password}"
          db_database: central_ledger
        configOverride:
          .EVENT_SDKrc: *eventSdkConfig
      centralledger-handler-transfer-get:
        config:
          kafka_host: "${kafka_host}"
          kafka_port: ${kafka_port}
          db_host: "${mysql_host}"
          db_port: ${mysql_port}
          db_user: central_ledger
          db_password: "${mysql_central_ledger_password}"
          db_database: central_ledger
        configOverride:
          .EVENT_SDKrc: *eventSdkConfig
      centralledger-handler-transfer-fulfil:
        config:
          kafka_host: "${kafka_host}"
          kafka_port: ${kafka_port}
          db_host: "${mysql_host}"
          db_port: ${mysql_port}
          db_user: central_ledger
          db_password: "${mysql_central_ledger_password}"
          db_database: central_ledger
        configOverride:
          .EVENT_SDKrc: *eventSdkConfig
      centralledger-handler-timeout:
        config:
          kafka_host: "${kafka_host}"
          kafka_port: ${kafka_port}
          db_host: "${mysql_host}"
          db_port: ${mysql_port}
          db_user: central_ledger
          db_password: "${mysql_central_ledger_password}"
          db_database: central_ledger
        configOverride:
          .EVENT_SDKrc: *eventSdkConfig
      centralledger-handler-admin-transfer:
        config:
          kafka_host: "${kafka_host}"
          kafka_port: ${kafka_port}
          db_host: "${mysql_host}"
          db_port: ${mysql_port}
          db_user: central_ledger
          db_password: "${mysql_central_ledger_password}"
          db_database: central_ledger
        configOverride:
          .EVENT_SDKrc: *eventSdkConfig

    # --- Quoting Service (shares central_ledger DB) ---
    # Event SDK: produces audit events to Kafka for Finance Portal reporting
    quoting-service:
      quoting-service:
        config:
          kafka_host: "${kafka_host}"
          kafka_port: ${kafka_port}
          db_host: "${mysql_host}"
          db_port: ${mysql_port}
          db_user: central_ledger
          db_password: "${mysql_central_ledger_password}"
          db_database: central_ledger
          simple_routing_mode_enabled: false
        configOverride:
          .EVENT_SDKrc: *eventSdkConfig
      quoting-service-handler:
        config:
          kafka_host: "${kafka_host}"
          kafka_port: ${kafka_port}
          db_host: "${mysql_host}"
          db_port: ${mysql_port}
          db_user: central_ledger
          db_password: "${mysql_central_ledger_password}"
          db_database: central_ledger
          # Must be false so the handler persists quotes to MySQL.
          # Without this, the aggregator's INNER JOIN on the quote table
          # returns zero rows, and the Finance Portal Transfers UI is empty.
          simple_routing_mode_enabled: false
        configOverride:
          .EVENT_SDKrc: *eventSdkConfig

    # --- Central Settlement (shares central_ledger DB) ---
    centralsettlement:
      centralsettlement-service:
        config:
          kafka_host: "${kafka_host}"
          kafka_port: ${kafka_port}
          db_host: "${mysql_host}"
          db_port: ${mysql_port}
          db_user: central_ledger
          db_password: "${mysql_central_ledger_password}"
          db_database: central_ledger
      centralsettlement-handler-deferredsettlement:
        config:
          kafka_host: "${kafka_host}"
          kafka_port: ${kafka_port}
          db_host: "${mysql_host}"
          db_port: ${mysql_port}
          db_user: central_ledger
          db_password: "${mysql_central_ledger_password}"
          db_database: central_ledger
      centralsettlement-handler-grosssettlement:
        config:
          kafka_host: "${kafka_host}"
          kafka_port: ${kafka_port}
          db_host: "${mysql_host}"
          db_port: ${mysql_port}
          db_user: central_ledger
          db_password: "${mysql_central_ledger_password}"
          db_database: central_ledger
        replicaCount: 0
      centralsettlement-handler-rules:
        config:
          kafka_host: "${kafka_host}"
          kafka_port: ${kafka_port}
          db_host: "${mysql_host}"
          db_port: ${mysql_port}
          db_user: central_ledger
          db_password: "${mysql_central_ledger_password}"
          db_database: central_ledger

    # --- Account Lookup Service ---
    # Event SDK: produces audit events to Kafka for Finance Portal reporting
    account-lookup-service:
      account-lookup-service:
        config:
          db_host: "${mysql_host}"
          db_port: ${mysql_port}
          db_user: account_lookup
          db_password: "${mysql_account_lookup_password}"
          db_database: account_lookup
          db_secret:
            name: mysqldb
            key: mysql-als-password
        init:
          enabled: true
        configOverride:
          .EVENT_SDKrc: *eventSdkConfig
      account-lookup-service-admin:
        config:
          db_host: "${mysql_host}"
          db_port: ${mysql_port}
          db_user: account_lookup
          db_password: "${mysql_account_lookup_password}"
          db_database: account_lookup
          db_secret:
            name: mysqldb
            key: mysql-als-password
        configOverride:
          .EVENT_SDKrc: *eventSdkConfig

    # --- ALS MSISDN Oracle ---
    als-msisdn-oracle:
      config:
        db_host: "${mysql_host}"
        db_port: ${mysql_port}
        db_user: oracle_msisdn
        db_password: "${mysql_oracle_msisdn_password}"
        db_database: oracle_msisdn
        db_secret:
          name: mysqldb
          key: mysql-oracle-password

    # --- ML API Adapter ---
    # Event SDK: produces audit events to Kafka for Finance Portal reporting
    ml-api-adapter:
      ml-api-adapter-service:
        config:
          kafka_host: "${kafka_host}"
          kafka_port: ${kafka_port}
        configOverride:
          .EVENT_SDKrc: *eventSdkConfig
      ml-api-adapter-handler-notification:
        config:
          kafka_host: "${kafka_host}"
          kafka_port: ${kafka_port}
        configOverride:
          .EVENT_SDKrc: *eventSdkConfig

    # --- Bulk (MongoDB) ---
    mojaloop-bulk:
      config:
        mongo_host: "${mongodb_host}"
        mongo_port: ${mongodb_port}
        mongo_database: mlos
        mongo_user: mlos
        mongo_password: "${mongodb_app_password}"

    # --- TTK (Testing Toolkit) ---
    ml-testing-toolkit:
      enabled: true
      config:
        mongodb:
          host: "${mongodb_host}"
          port: "${mongodb_port}"
          user: ttk
          password: "${mongodb_app_password}"
          database: ttk
          secret: null
          connectionString: null
          connectionStringSecret:
            name: null
            key: null
          params: {}
          ssl:
            enabled: false
            verify: false
            caSecret: {}
            clientCert: {}
      ml-testing-toolkit-backend:
        initContainers: |
          - name: wait-for-mongodb
            image: bitnamilegacy/mongodb:6.0.1
            imagePullPolicy: IfNotPresent
            command:
              - sh
              - -c
              - |
                MONGO_TLS_ARGS="";
                if [ "$DB_SSL_ENABLED" = "true" ]; then
                  MONGO_TLS_ARGS="--tls=true";
                  if [ "$DB_SSL_VERIFY" = "false" ]; then
                    MONGO_TLS_ARGS="$MONGO_TLS_ARGS --tlsAllowInvalidHostnames=true";
                  fi;
                  if [ -n "$DB_SSL_CA" ]; then
                    echo "$DB_SSL_CA" > /tmp/ca.pem
                    MONGO_TLS_ARGS="$MONGO_TLS_ARGS --tlsCAFile /tmp/ca.pem"
                  fi
                  if [ -n "$DB_SSL_CLIENT_CERT" ]; then
                    echo "$DB_SSL_CLIENT_CERT" > /tmp/client-cert.pem
                    MONGO_TLS_ARGS="$MONGO_TLS_ARGS --tlsCertificateKeyFile /tmp/client-cert.pem"
                  fi
                fi;
                PARAMS="";
                if [ -n "$DB_PARAMS" ]; then
                  PARAMS=$(echo "$DB_PARAMS" | jq -r 'to_entries | map("\(.key)=\(.value|tostring)") | join("&")');
                  PARAMS="?$PARAMS";
                fi;
                until mongosh "mongodb://$DB_HOST:$DB_PORT/$DB_DATABASE$PARAMS" --authenticationDatabase "$DB_DATABASE" --username "$DB_USER" --password "$DB_PASS" $MONGO_TLS_ARGS --eval "disableTelemetry();db.adminCommand('ping')" ;
                do
                  echo --------------------;
                  echo Waiting for MongoDB...;
                  sleep 2;
                done;
                echo ====================;
                echo MongoDB ok!;
            env:
              - name: DB_HOST
                value: '{{ .Values.config.mongodb.host }}'
              - name: DB_PORT
                value: '{{ .Values.config.mongodb.port }}'
              - name: DB_USER
                value: '{{ .Values.config.mongodb.user }}'
              - name: DB_PASS
              {{- if .Values.config.mongodb.secret }}
                valueFrom:
                  secretKeyRef:
                    name: '{{ .Values.config.mongodb.secret.name }}'
                    key: '{{ .Values.config.mongodb.secret.key }}'
              {{- else }}
                value: {{ .Values.config.mongodb.password }}
              {{- end }}
              - name: DB_DATABASE
                value: '{{ .Values.config.mongodb.database }}'
              - name: DB_SSL_ENABLED
                value: '{{ .Values.config.mongodb.ssl.enabled }}'
              - name: DB_SSL_VERIFY
                value: '{{ .Values.config.mongodb.ssl.verify }}'
              {{- if .Values.config.mongodb.ssl.caSecret.name }}
              - name: DB_SSL_CA
                valueFrom:
                  secretKeyRef:
                    name: '{{ .Values.config.mongodb.ssl.caSecret.name }}'
                    key: '{{ .Values.config.mongodb.ssl.caSecret.key }}'
              {{- end }}
              {{- if .Values.config.mongodb.ssl.clientCert.name }}
              - name: DB_SSL_CLIENT_CERT
                valueFrom:
                  secretKeyRef:
                    name: '{{ .Values.config.mongodb.ssl.clientCert.name }}'
                    key: '{{ .Values.config.mongodb.ssl.clientCert.key }}'
              {{- end }}
              {{- if .Values.config.mongodb.params }}
              - name: DB_PARAMS
                value: {{ .Values.config.mongodb.params | toJson | quote }}
              {{- end }}
        config:
          mongodb:
            host: "${mongodb_host}"
            port: "${mongodb_port}"
            user: ttk
            password: "${mongodb_app_password}"
            database: ttk
            secret:
              name: bulk-mongodb-app-secrets
              key: MONGODB_APP_PASSWORD
            connectionString: null
            connectionStringSecret:
              name: null
              key: null
            params: {}
            ssl:
              enabled: false
              verify: false
              caSecret: {}
              clientCert: {}

      ml-testing-toolkit-frontend:
        config:
          API_BASE_URL: https://ttk-backend.int.${domain}

      ml-testing-toolkit-cli:
        enabled: false

    # --- Third Party (deferred) ---
    thirdparty:
      enabled: false

    # --- Simulator ---
    mojaloop-simulator:
      enabled: true

    # --- Feature Flags ---
    forensicloggingsidecar:
      enabled: false
