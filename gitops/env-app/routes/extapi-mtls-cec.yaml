# CiliumEnvoyConfig: inbound mTLS listener for FSPIOP external API
#
# Runs on Cilium's existing Envoy DaemonSet (zero additional pods).
# Terminates TLS with mutual authentication:
#   - Server cert: extapi-mtls-tls (cert-manager, Let's Encrypt)
#   - Client verification: dfsp-ca-bundle (vault-agent rendered, combined DFSP CAs)
#
# Routes requests by path prefix to Mojaloop backend services.
apiVersion: cilium.io/v2
kind: CiliumEnvoyConfig
metadata:
  name: extapi-mtls
  namespace: mojaloop
spec:
  services:
    - name: extapi-mtls
      namespace: mojaloop
  resources:
    # --- Envoy Listener: TLS with mutual authentication ---
    - "@type": type.googleapis.com/envoy.config.listener.v3.Listener
      name: extapi-mtls-listener
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              require_client_certificate: true
              common_tls_params:
                tls_certificate_sds_secret_configs:
                  - name: "mojaloop/extapi-mtls-tls"
                    sds_config:
                      api_config_source:
                        api_type: GRPC
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: xds-grpc-cilium
                validation_context_sds_secret_config:
                  name: "mojaloop/dfsp-ca-bundle"
                  sds_config:
                    api_config_source:
                      api_type: GRPC
                      grpc_services:
                        - envoy_grpc:
                            cluster_name: xds-grpc-cilium
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: extapi_mtls
                codec_type: AUTO
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: extapi_routes
                  virtual_hosts:
                    - name: extapi
                      domains: ["*"]
                      routes:
                        # Account Lookup Service
                        - match:
                            prefix: "/participants"
                          route:
                            cluster: mojaloop/moja-account-lookup-service:80
                        - match:
                            prefix: "/parties"
                          route:
                            cluster: mojaloop/moja-account-lookup-service:80
                        # Quoting Service
                        - match:
                            prefix: "/quotes"
                          route:
                            cluster: mojaloop/moja-quoting-service:80
                        - match:
                            prefix: "/fxQuotes"
                          route:
                            cluster: mojaloop/moja-quoting-service:80
                        # ML API Adapter (transfers)
                        - match:
                            prefix: "/transfers"
                          route:
                            cluster: mojaloop/moja-ml-api-adapter-service:80
                        - match:
                            prefix: "/fxTransfers"
                          route:
                            cluster: mojaloop/moja-ml-api-adapter-service:80
                        # Transaction Requests Service
                        - match:
                            prefix: "/transactionRequests"
                          route:
                            cluster: mojaloop/moja-transaction-requests-service:80
                        - match:
                            prefix: "/authorizations"
                          route:
                            cluster: mojaloop/moja-transaction-requests-service:80
