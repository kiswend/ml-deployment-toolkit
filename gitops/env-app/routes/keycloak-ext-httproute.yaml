# Keycloak external interface — DFSP OIDC authentication
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-ext
  namespace: keycloak
spec:
  parentRefs:
    - name: gw-ext
      namespace: istio-ingress-ext
  hostnames:
    - "keycloak.ext.${domain}"
  rules:
    - backendRefs:
        - name: keycloak-service
          port: 8080
