apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: minio
  namespace: flux-system
spec:
  interval: 24h
  url: https://charts.min.io/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: minio
      version: "5.x"
      sourceRef:
        kind: HelmRepository
        name: minio
      interval: 12h
  releaseName: minio
  targetNamespace: minio
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  dependsOn:
    - name: vault-operator
  valuesFrom:
    - kind: Secret
      name: minio-credentials
      targetPath: rootUser
      valuesKey: rootUser
    - kind: Secret
      name: minio-credentials
      targetPath: rootPassword
      valuesKey: rootPassword
  values:
    mode: standalone
    replicas: 1
    persistence:
      enabled: true
      size: 20Gi
    resources:
      requests:
        memory: 256Mi
    consoleIngress:
      enabled: false
