apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-gateway
  namespace: flux-system
spec:
  interval: 30m
  dependsOn:
    - name: istiod
  chart:
    spec:
      chart: gateway
      version: "1.29.x"
      sourceRef:
        kind: HelmRepository
        name: istio
      interval: 12h
  targetNamespace: istio-ingress-ext
  install:
    crds: Skip
    disableSchemaValidation: true
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    disableSchemaValidation: true
    remediation:
      retries: 3
  values:
    service:
      type: ClusterIP
