apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: flux-system
spec:
  interval: 30m
  dependsOn:
    - name: istio-base
  chart:
    spec:
      chart: istiod
      version: "1.29.x"
      sourceRef:
        kind: HelmRepository
        name: istio
      interval: 12h
  targetNamespace: istio-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # No global sidecar injection — gateway-only mode
    sidecarInjectorWebhook:
      enableNamespacesByDefault: false

    meshConfig:
      # Extension providers for future ext-authz integration (Oathkeeper)
      extensionProviders:
        - name: oathkeeper
          envoyExtAuthzHttp:
            service: oathkeeper-proxy.ory.svc.cluster.local
            port: 4455
            headersToUpstreamOnAllow:
              - authorization
              - x-user
              - x-email
              - x-roles
            headersToDownstreamOnDeny:
              - content-type
              - set-cookie
            includeRequestHeadersInCheck:
              - authorization
              - cookie
