apiVersion: batch/v1
kind: Job
metadata:
  name: kratos-hub-admin-bootstrap
  namespace: ory
  annotations:
    kustomize.toolkit.fluxcd.io/force: "enabled"
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: curlimages/curl:8.7.1
          command: [sh, -c]
          args:
            - |
              set -e

              echo "Waiting for Kratos admin API..."
              until curl -sf http://kratos-admin.ory.svc.cluster.local/health/ready > /dev/null 2>&1; do
                echo "  not ready, retrying in 5s..."
                sleep 5
              done
              echo "Kratos admin API is ready."

              echo "Creating hub admin identity ($HUB_ADMIN_EMAIL) with hub-admin role..."
              HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
                -X POST http://kratos-admin.ory.svc.cluster.local/admin/identities \
                -H "Content-Type: application/json" \
                -d "{\"schema_id\":\"default\",\"traits\":{\"email\":\"$HUB_ADMIN_EMAIL\",\"name\":\"Hub Admin\",\"roles\":[\"hub-admin\"]},\"credentials\":{\"password\":{\"config\":{\"password\":\"$HUB_ADMIN_PASSWORD\"}}}}")

              echo "HTTP $HTTP_CODE: $(cat /tmp/resp.json)"
              case "$HTTP_CODE" in
                201) echo "Identity created." ;;
                409) echo "Identity already exists." ;;
                *) echo "Unexpected status $HTTP_CODE"; exit 1 ;;
              esac

              echo "Patching identity to ensure hub-admin role is set..."
              IDENTITY_ID=$(curl -sf \
                "http://kratos-admin.ory.svc.cluster.local/admin/identities?credentials_identifier=$HUB_ADMIN_EMAIL" \
                | grep -o '"id":"[^"]*"' | head -1 | sed 's/"id":"//;s/"//')
              echo "Identity ID: $IDENTITY_ID"
              HTTP_CODE=$(curl -s -o /tmp/patch-resp.json -w "%{http_code}" \
                -X PATCH "http://kratos-admin.ory.svc.cluster.local/admin/identities/$IDENTITY_ID" \
                -H "Content-Type: application/json" \
                -d '[{"op":"add","path":"/traits/roles","value":["hub-admin"]}]')
              echo "Patch HTTP $HTTP_CODE: $(cat /tmp/patch-resp.json)"
              case "$HTTP_CODE" in
                2*) echo "Role patch succeeded." ;;
                *) echo "Patch failed with $HTTP_CODE"; exit 1 ;;
              esac
          env:
            - name: HUB_ADMIN_EMAIL
              value: "${hub_admin_email}"
            - name: HUB_ADMIN_PASSWORD
              value: "${hub_admin_password}"
