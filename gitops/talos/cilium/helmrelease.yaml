apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 24h
  url: https://helm.cilium.io/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: "1.18.7"
      sourceRef:
        kind: HelmRepository
        name: cilium
      interval: 12h
  targetNamespace: cilium
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Kube-proxy replacement (Cilium handles all service routing)
    kubeProxyReplacement: true

    # IPAM mode — use Kubernetes-assigned pod CIDRs
    ipam:
      mode: kubernetes

    # Talos-specific: cgroup settings
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup

    # Talos-specific: capabilities for restricted runtime
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE

    # Gateway API support (CRDs installed via Talos extraManifests)
    gatewayAPI:
      enabled: true

    # LB-IPAM for on-prem load balancer
    lbIPAM:
      enabled: true

    # L2 announcements for LB IPs
    l2announcements:
      enabled: true

    # Cilium agent Prometheus metrics (port 9962)
    prometheus:
      enabled: true

    # Note: prometheus.enabled=true already adds prometheus.io/scrape and
    # prometheus.io/port annotations to agent pods — no podAnnotations needed

    # Hubble observability and metrics
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true
      metrics:
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - icmp
          - httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction
        dashboards:
          enabled: false

    # Envoy proxy (external) with prometheus metrics for CEC visibility
    envoy:
      enabled: true
      prometheus:
        enabled: true

    # Operator settings
    operator:
      replicas: 1

    # Agent resource limits (prevent OOM during BPF compilation)
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        cpu: 1000m
        memory: 1Gi

