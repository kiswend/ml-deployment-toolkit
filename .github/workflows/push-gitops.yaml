name: Push GitOps OCI Artifact

on:
  push:
    tags:
      - "v*"

permissions:
  packages: write
  contents: read

env:
  OCI_REPO: ghcr.io/${{ github.repository }}

jobs:
  push-gitops:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flux CLI
        uses: fluxcd/flux2/action@main

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | flux login ghcr.io --username=${{ github.actor }} --password-stdin

      - name: Push OCI artifact
        run: |
          VERSION=${GITHUB_REF_NAME}
          flux push artifact oci://${{ env.OCI_REPO }}:${VERSION} \
            --path=./gitops \
            --source="${{ github.server_url }}/${{ github.repository }}" \
            --revision="${VERSION}@sha1:${{ github.sha }}"

      - name: Tag as latest
        run: |
          VERSION=${GITHUB_REF_NAME}
          flux tag artifact oci://${{ env.OCI_REPO }}:${VERSION} --tag=latest
